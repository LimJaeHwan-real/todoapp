<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>할일 목록</title>
    <style>
        body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#182334;margin:0;line-height:1.6}
        main{max-width:760px;margin:48px auto;padding:28px;background:white;border-radius:12px}
        header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
        h1{margin:0}a{color:#1d4ed8}a:focus-visible{outline:3px solid #2563eb;outline-offset:4px}
        .button{display:inline-block;background:#1d4ed8;color:white;text-decoration:none;padding:10px 16px;border-radius:6px}
        button{font:inherit;border:0;cursor:pointer}button:focus-visible{outline:3px solid #2563eb;outline-offset:4px}
        ul{list-style:none;padding:0;margin:24px 0 0}li{padding:18px 0;border-top:1px solid #dbe1e8}
        li a{font-weight:600;overflow-wrap:anywhere}time{display:block;font-size:.9rem;color:#526175}
        .pagination{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:24px}
        .pagination a,.pagination span{padding:6px 10px;border:1px solid #dbe1e8;border-radius:4px;text-decoration:none}
        .pagination [aria-current]{background:#1d4ed8;color:white;border-color:#1d4ed8}
        .pagination [aria-disabled]{color:#526175;background:#f5f7fa}
        .search{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin-top:24px}
        .search label{display:block;font-weight:600}.search input{font:inherit;padding:9px;border:1px solid #94a3b8;border-radius:6px;width:min(320px,65vw)}
        .search input:focus-visible{outline:3px solid #2563eb;outline-offset:2px}
        .hint{font-size:.9rem;color:#526175}.error{color:#b91c1c}
        .empty{margin-top:32px;color:#526175}@media(max-width:800px){main{margin:16px;padding:20px}}
    </style>
</head>
<body>
<main>
    <header><h1>할일 목록</h1><a class="button" th:href="@{/todos/new}">새 할일 등록</a></header>
    <form th:action="@{/logout}" method="post"><button class="button" type="submit">로그아웃</button></form>
    <form class="search" th:action="@{/todos}" method="get" role="search">
        <div><label for="q">제목 검색</label><input id="q" name="q" type="search" maxlength="255" th:value="${q}" aria-describedby="search-help search-error" /></div>
        <button class="button" type="submit">검색</button><a th:href="@{/todos}">전체 목록</a>
    </form>
    <p id="search-help" class="hint">연속된 글자 또는 숫자를 3자 이상 입력해 주세요. 제목에 포함된 검색어를 찾습니다.</p>
    <p id="search-error" class="error" role="alert" th:if="${searchError != null}" th:text="${searchError}">검색어 안내</p>
    <p class="empty" th:if="${searchError == null and #lists.isEmpty(todos)}"
       th:text="${hasCursor ? '더 이상 표시할 결과가 없습니다. 처음으로 돌아가 다시 확인해 주세요.' : (#strings.isEmpty(q) ? '등록된 할일이 없습니다. 새 할일을 등록해 보세요.' : '검색 결과가 없습니다. 다른 검색어로 검색해 보세요.')}">등록된 할일이 없습니다.</p>
    <ul th:unless="${#lists.isEmpty(todos)}">
        <li th:each="todo : ${todos}">
            <a th:href="@{/todos/{id}(id=${todo.id})}" th:text="${todo.title}">할일 제목</a>
            <time th:if="${todo.createdAt != null}" th:datetime="${todo.createdAt}"
                  th:text="${#temporals.format(todo.createdAt, 'yyyy-MM-dd HH:mm')}">등록일</time>
        </li>
    </ul>
    <nav class="pagination" aria-label="목록 페이지" th:if="${searchError == null and (hasCursor or !#lists.isEmpty(todos))}">
        <a th:if="${hasCursor}" th:href="@{/todos(q=${q})}" aria-label="첫 페이지">처음</a>
        <a th:if="${previousCursor != null}" th:href="@{/todos(q=${q},before=${previousCursor})}" aria-label="이전 페이지">이전</a>
        <span th:unless="${previousCursor != null}" aria-label="이전 페이지" aria-disabled="true">이전</span>
        <a th:if="${nextCursor != null}" th:href="@{/todos(q=${q},after=${nextCursor})}" aria-label="다음 페이지">다음</a>
        <span th:unless="${nextCursor != null}" aria-label="다음 페이지" aria-disabled="true">다음</span>
    </nav>
</main>
</body>
</html>
