<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입</title>
    <style>
        body{font-family:system-ui,sans-serif;background:#f5f7fa;color:#182334;margin:0;line-height:1.6}
        main{max-width:440px;margin:48px auto;padding:28px;background:white;border-radius:12px}
        label{display:block;font-weight:600;margin:20px 0 8px}
        input{box-sizing:border-box;width:100%;font:inherit;padding:10px 12px;border:1px solid #8492a6;border-radius:6px}
        button{font:inherit;border:0;background:#1d4ed8;color:white;padding:10px 16px;border-radius:6px;cursor:pointer}
        a{color:#1d4ed8}.actions{display:flex;align-items:center;gap:16px;margin-top:24px}.error{color:#b91c1c}.hint{font-size:.9rem;color:#526175}
        a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2563eb;outline-offset:3px}
        @media(max-width:520px){main{margin:16px;padding:20px}}
    </style>
</head>
<body>
<main>
    <h1>회원가입</h1>
    <form th:action="@{/signup}" th:object="${signupForm}" method="post">
        <div class="error" role="alert" th:if="${#fields.hasAnyErrors()}">
            <p th:each="error : ${#fields.allErrors()}" th:text="${error}">입력 오류</p>
        </div>
        <label for="username">아이디</label>
        <input id="username" th:field="*{username}" type="text" autocomplete="username" required="required"
               minlength="3" maxlength="50" pattern="[A-Za-z0-9._\-]{3,50}" aria-describedby="username-hint" />
        <p id="username-hint" class="hint">영문, 숫자, 점, 밑줄, 하이픈으로 3~50자 입력해 주세요. 대소문자를 구분합니다.</p>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="new-password" required="required"
               minlength="4" aria-describedby="password-hint" />
        <p id="password-hint" class="hint">4자 이상, UTF-8 기준 72바이트 이하로 입력해 주세요. 한글은 보통 한 글자당 3바이트입니다.</p>
        <div class="actions"><button type="submit">회원가입</button><a th:href="@{/login}">로그인</a></div>
    </form>
</main>
</body>
</html>
